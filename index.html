<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Timer Live IndoFinity</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: Inter, Arial, sans-serif;
    }

    #container {
      width: 360px;
      height: 520px;
      background: #2a242c;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }

    #timerBox {
      width: 100%;
      height: 90px;
      background: #3a343d;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    #timerWrapper {
      display: flex;
      align-items: center;
    }

    #timer {
      font-size: 56px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
    }

    #plus {
      margin-left: 12px;
      font-size: 26px;
      font-weight: 800;
      color: #ffd84d;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    #plus.show {
      opacity: 1;
      transform: translateY(-6px);
    }

    #supportBox {
      width: 100%;
      height: calc(100% - 114px);
      background: #241f26;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }

    .shake {
      animation: shake 0.25s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>

  <div id="container">
    <div id="timerBox">
      <div id="timerWrapper">
        <div id="timer">30</div>
        <div id="plus">+5</div>
      </div>
    </div>

    <div id="supportBox">
      IndoFinity connected
    </div>
  </div>

  <script>
    /* =====================
       KONFIGURASI
    ====================== */
    const MAX_TIME = 30;
    const ADD_TIME = 5;
    const WS_URL = "ws://localhost:62024";

    let timeLeft = MAX_TIME;
    let interval = null;
    let socket = null;

    const timerEl = document.getElementById("timer");
    const plusEl = document.getElementById("plus");
    const container = document.getElementById("container");
    const supportBox = document.getElementById("supportBox");

    const audio = new Audio(
      "https://assets.mixkit.co/sfx/preview/mixkit-bell-notification-933.mp3"
    );

    /* =====================
       TIMER CORE
    ====================== */
    function updateDisplay() {
      timerEl.textContent = timeLeft < 10 ? "0" + timeLeft : timeLeft;
      timerEl.style.color = timeLeft <= 10 ? "#ff4d4d" : "#ffffff";
    }

    function startTimer() {
      if (interval) return;
      interval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          stopTimer();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(interval);
      interval = null;
    }

    function resetTimer() {
      stopTimer();
      timeLeft = MAX_TIME;
      updateDisplay();
    }

    function addTime(sec) {
      // ⛔ JIKA TIMER SUDAH HABIS, GIFT DIABAIKAN
      if (timeLeft === 0) {
        console.log("Gift ignored — timer ended");
        return;
      }

      const before = timeLeft;
      timeLeft = Math.min(timeLeft + sec, MAX_TIME);
      updateDisplay();

      if (timeLeft > before) {
        plusEl.textContent = `+${sec}`;
        plusEl.classList.add("show");
        container.classList.add("shake");

        try {
          audio.currentTime = 0;
          audio.play();
        } catch(e) {}

        setTimeout(() => {
          plusEl.classList.remove("show");
          container.classList.remove("shake");
        }, 900);
      }
    }

    /* =====================
       KEYBOARD (BACKUP)
    ====================== */
    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k === "o") startTimer();
      if (k === "l") stopTimer();
      if (k === "k") resetTimer();
      if (k === "g") addTime(ADD_TIME);
    });

    /* =====================
       INDOFINITY WEBSOCKET
    ====================== */
    function connectWebSocket() {
      try {
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
          supportBox.textContent = "IndoFinity connected";
          console.log("WS connected");
        };

        socket.onmessage = (msg) => {
          try {
            const payload = JSON.parse(msg.data);

            if (payload.event !== "gift") return;

            const giftName = payload.data?.giftName;
            const count = payload.data?.repeatCount || 1;

            if (giftName === "Finger Heart") {
              addTime(ADD_TIME * count);
              console.log("Finger Heart x" + count);
            }
          } catch(err) {
            console.error("WS parse error", err);
          }
        };

        socket.onclose = () => {
          supportBox.textContent = "IndoFinity disconnected";
          setTimeout(connectWebSocket, 3000);
        };

        socket.onerror = () => {
          socket.close();
        };

      } catch(e) {
        console.error("WS failed", e);
      }
    }

    connectWebSocket();
    updateDisplay();
  </script>

</body>
</html>
