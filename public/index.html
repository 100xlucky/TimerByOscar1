<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Sync</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 15px; }
        .timer { font-size: 60px; font-weight: bold; color: #ff3e3e; margin: 15px 0; }
        .info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: none; }
        button { background: #ff3e3e; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div>
        <input type="text" id="username" placeholder="Yayıncı Kullanıcı Adı">
        <button onclick="connectLive()">Bağlan</button>
    </div>

    <div class="info">
        👥 İzleyici: <span id="viewers">0</span> | 🎁 Sandık: <span id="chestInfo">Bekleniyor...</span>
    </div>

    <div class="timer" id="timer">10.0</div>

    <script>
        const socket = io();

        function connectLive() {
            const user = document.getElementById('username').value;
            if (user) {
                socket.emit('setUniqueId', user);
            }
        }

        socket.on('updateViewers', (count) => {
            document.getElementById('viewers').innerText = count;
        });

        socket.on('chestEvent', (data) => {
            document.getElementById('chestInfo').innerText = `${data.coins || 0} Jeton`;
        });
    </script>
</body>
</html>
