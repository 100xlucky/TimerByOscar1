<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Timer</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;font-family:Inter,Arial}
#container{width:360px;height:520px;background:#2a242c;border-radius:22px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.6)}
#timerBox{height:90px;background:#3a343d;border-radius:14px;display:flex;align-items:center;justify-content:center}
#timer{font-size:56px;font-weight:700;color:#fff}
#supportBox{margin-top:24px;height:calc(100% - 114px);background:#241f26;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#aaa}
</style>
</head>

<body>
<div id="container">
  <div id="timerBox"><div id="timer">30</div></div>
  <div id="supportBox">IndoFinity connected</div>
</div>

<script>
const timer = document.getElementById("timer");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host
);

ws.onmessage = e => {
  const s = JSON.parse(e.data);
  timer.textContent = s.time < 10 ? "0"+s.time : s.time;
  timer.style.color = s.time <= 10 ? "#ff4d4d" : "#ffffff";
};
</script>
</body>
</html>
