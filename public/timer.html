<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Timer Live IndoFinity</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  font-family:Arial;
}
#container{
  width:360px;
  height:520px;
  background:#2a242c;
  border-radius:22px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
#timer{
  font-size:56px;
  color:#fff;
}
</style>
</head>

<body>
<div id="container">
  <div id="timer">30</div>
</div>

<script>
const MAX_TIME = 30;
const ADD_TIME = 5;

/* 🔴 GANTI SETELAH DEPLOY RENDER */
const WS_URL = "wss://timerbyoscar.onrender.com";

let timeLeft = MAX_TIME;
let interval = null;

const timerEl = document.getElementById("timer");

function update(){
  timerEl.textContent = timeLeft;
}

function start(){
  if(interval) return;
  interval = setInterval(()=>{
    if(timeLeft > 0){
      timeLeft--;
      update();
    }else{
      stop();
    }
  },1000);
}

function stop(){
  clearInterval(interval);
  interval = null;
}

function reset(){
  stop();
  timeLeft = MAX_TIME;
  update();
}

function add(sec){
  if(timeLeft === 0) return;
  timeLeft = Math.min(timeLeft + sec, MAX_TIME);
  update();
}

/* 🔌 WEBSOCKET CONTROL */
const ws = new WebSocket(WS_URL);

ws.onmessage = e=>{
  if(e.data === "START") start();
  if(e.data === "STOP") stop();
  if(e.data === "RESET") reset();
  if(e.data === "ADD_5") add(ADD_TIME);
};

update();
</script>
</body>
</html>
